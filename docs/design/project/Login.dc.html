<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; color: #14211A; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column">

        <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">VetLink</span>
      </div>
      <div style="display: flex; padding: 3px; background: rgba(255,255,255,0.14); border-radius: 999px">
        <button style="height: 34px; padding: 0 12px; border: 0; border-radius: 999px; background: #FFFFFF; color: #1F5F3F; font-family: inherit; font-size: 13px; font-weight: 700">EN</button>
        <button style="height: 34px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">SW</button>

    <div>

      <p style="margin: 12px 0 0; font-size: 16px; line-height: 24px; color: #CFE3D6">Verified vets and animal health workers near you.</p>
    </div>
  </div>

  <div style="flex: 1; padding: 32px 24px 24px; display: flex; flex-direction: column; gap: 20px">
    <label style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; font-weight: 700">Your phone number
      <span style="display: flex; height: 56px; border: 1.5px solid #1F5F3F; border-radius: 12px; overflow: hidden; background: #FFFFFF; box-shadow: 0 0 0 4px #E4F0E8">
        <span style="display: flex; align-items: center; padding: 0 14px; background: #F5F6F2; border-right: 1px solid #DCE2DC; font-size: 18px; font-weight: 700">+254</span>
        <input inputmode="tel" placeholder="7XX XXX XXX" style="flex: 1; min-width: 0; border: 0; padding: 0 14px; font-family: inherit; font-size: 18px; color: #14211A; outline: none; background: #FFFFFF">
      </span>
    </label>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #55625A">We'll send a 6-digit code by SMS. Your phone number is your account.</p>
    <button style="height: 56px; border: 0; border-radius: 12px; background: #1F5F3F; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">Send code</button>

    <div style="margin-top: auto; background: #FFFFFF; border: 1px solid #DCE2DC; border-radius: 16px; padding: 16px; display: flex; gap: 14px; align-items: center">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #FDF1D8; color: #8A5A00; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
      </div>

        <div style="font-weight: 700">No smartphone or data?</div>
        <div style="color: #55625A">Dial <b style="color: #14211A">[USSD CODE]</b> from any phone.</div>
      </div>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 18px; color: #55625A; text-align: center">By continuing you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
