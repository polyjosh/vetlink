name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Build production API image
        run: docker build -f apps/api/Dockerfile --target prod -t vetlink-api:ci .
