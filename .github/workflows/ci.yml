name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres: # DB integration tests create and drop throwaway databases here
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: vetlink
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: vetlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vetlink" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis: # rate-limit / lockout counter tests
        image: redis:7.4.11-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vetlink:ci-only@localhost:5432/vetlink
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Build production API image
        run: docker build -f apps/api/Dockerfile --target prod -t vetlink-api:ci .
